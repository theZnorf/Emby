<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow multiTagSearchPage" data-mousewheel="true" data-horizontal="false" data-forcescrollbar="true" data-bindheader="true" data-controller="__plugin/multitagsearchjs">
    <div class="scrollSlider flex-grow flex-direction-column padded-top-page padded-bottom-page padded-left padded-right">

        <style>
            .mts-form { display: grid; gap: 1em; max-width: 60em; }
            .mts-row { display: flex; flex-wrap: wrap; gap: 1em; align-items: flex-end; }
            .mts-field { display: flex; flex-direction: column; gap: .35em; min-width: 12em; flex: 1 1 12em; }
            .mts-field > label { font-size: .9em; opacity: .75; }
            .mts-input, .mts-select { font: inherit; color: inherit; background: rgba(128,128,128,.15); border: 1px solid rgba(128,128,128,.35); border-radius: .3em; padding: .55em .7em; }
            .mts-select option { color: #000; }
            .mts-chips { display: flex; flex-wrap: wrap; gap: .4em; min-height: 1.9em; align-items: center; }
            .mts-chip { display: inline-flex; align-items: center; gap: .3em; border-radius: 1em; padding: .25em .4em .25em .8em; font-size: .9em; border: 1px solid rgba(128,128,128,.4); background: rgba(82,181,75,.25); }
            .mts-chip.mts-exclude { background: rgba(204,51,51,.25); }
            .mts-chip button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0 .3em; opacity: .7; }
            .mts-chip button:hover { opacity: 1; }
            .mts-hint { opacity: .6; font-size: .85em; }
            .mts-actions { display: flex; gap: .8em; align-items: center; flex-wrap: wrap; }
            .mts-btn { font: inherit; color: inherit; cursor: pointer; border-radius: .3em; padding: .6em 1.4em; border: 1px solid rgba(128,128,128,.4); background: rgba(128,128,128,.2); }
            .mts-btn-primary { background: #52b54b; border-color: #52b54b; color: #fff; }
            .mts-status { margin: 1.2em 0 .8em; opacity: .8; }
            .mts-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5em, 1fr)); gap: 1.2em .9em; }
            .mts-card { color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: .35em; min-width: 0; }
            .mts-poster { position: relative; width: 100%; padding-bottom: 150%; border-radius: .3em; overflow: hidden; background: rgba(128,128,128,.2); }
            .mts-poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
            .mts-poster span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: .5em; font-size: .9em; opacity: .7; }
            .mts-card:hover .mts-poster, .mts-card:focus .mts-poster { outline: 3px solid #52b54b; }
            .mts-toolbar { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; margin-bottom: 1.2em; }
            .mts-toolbar.hide { display: none; }
            .mts-toolbar .mts-btn { padding: .5em 1em; }
            .mts-sep { flex: 1 1 0; }
            .mts-btnSelectNone.hide { display: none; }
            .mts-check { position: absolute; top: .4em; left: .4em; z-index: 1; width: 1.6em; height: 1.6em; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.45); color: #fff; font-size: .9em; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity .15s; padding: 0; }
            .mts-card:hover .mts-check, .mts-card:focus-within .mts-check, .mts-selecting .mts-check { opacity: 1; }
            .mts-card.mts-selected .mts-check { background: #52b54b; border-color: #52b54b; }
            .mts-card.mts-selected .mts-poster { outline: 3px solid #52b54b; }
            @media (hover: none) { .mts-check { opacity: 1; } }
            .mts-title { font-size: .95em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .mts-sub { font-size: .8em; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        </style>

        <h1 style="margin-top:0;">Tag Search</h1>

        <form class="mts-form" autocomplete="off">
            <div class="mts-field">
                <label for="mtsIncludeInput">Must have <strong class="mts-modeLabel">all</strong> of these tags</label>
                <div class="mts-chips mts-includeChips"></div>
                <input id="mtsIncludeInput" class="mts-input mts-includeInput" type="text" list="mtsTagList" placeholder="Type a tag and press Enter" />
            </div>

            <div class="mts-field">
                <label for="mtsExcludeInput">Must <strong>not</strong> have any of these tags</label>
                <div class="mts-chips mts-excludeChips"></div>
                <input id="mtsExcludeInput" class="mts-input mts-excludeInput" type="text" list="mtsTagList" placeholder="Optional" />
            </div>

            <datalist id="mtsTagList"></datalist>

            <div class="mts-row">
                <div class="mts-field">
                    <label for="mtsMode">Match</label>
                    <select id="mtsMode" class="mts-select mts-mode">
                        <option value="all">All tags (AND)</option>
                        <option value="any">Any tag (OR)</option>
                    </select>
                </div>
                <div class="mts-field">
                    <label for="mtsTypes">Type</label>
                    <select id="mtsTypes" class="mts-select mts-types">
                        <option value="Movie">Movies</option>
                        <option value="Series">Series</option>
                        <option value="Episode">Episodes</option>
                        <option value="MusicVideo">Music videos</option>
                        <option value="Movie,Series,Episode,MusicVideo,Video">All video</option>
                        <option value="">Everything</option>
                    </select>
                </div>
                <div class="mts-field">
                    <label for="mtsLibrary">Library</label>
                    <select id="mtsLibrary" class="mts-select mts-library">
                        <option value="">All libraries</option>
                    </select>
                </div>
                <div class="mts-field">
                    <label for="mtsSort">Sort by</label>
                    <select id="mtsSort" class="mts-select mts-sort">
                        <option value="SortName,Ascending">Name</option>
                        <option value="ProductionYear,Descending">Year (newest)</option>
                        <option value="ProductionYear,Ascending">Year (oldest)</option>
                        <option value="DateCreated,Descending">Date added</option>
                        <option value="CommunityRating,Descending">Rating</option>
                        <option value="Random,Ascending">Random</option>
                    </select>
                </div>
            </div>

            <div class="mts-actions">
                <button type="submit" class="mts-btn mts-btn-primary">Search</button>
                <button type="button" class="mts-btn mts-btnClear">Clear</button>
                <span class="mts-hint">Tags are matched by name, case-insensitive. Click a result to open it, or tick results to play or collect just those.</span>
            </div>
        </form>

        <div class="mts-status"></div>

        <div class="mts-toolbar hide">
            <button type="button" class="mts-btn mts-btn-primary mts-btnPlay" title="Play in Emby's player">&#9654; Play <span class="mts-scope"></span></button>
            <button type="button" class="mts-btn mts-btnShuffle">Shuffle</button>
            <button type="button" class="mts-btn mts-btnCollection">Add to collection…</button>
            <button type="button" class="mts-btn mts-btnPlaylist">Add to playlist…</button>
            <span class="mts-sep"></span>
            <button type="button" class="mts-btn mts-btnSelectAll">Select all</button>
            <button type="button" class="mts-btn mts-btnSelectNone hide">Clear selection</button>
        </div>

        <div class="mts-results"></div>
    </div>
</div>
