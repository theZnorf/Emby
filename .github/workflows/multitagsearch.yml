name: Multi-Tag Search plugin

on:
  push:
    paths:
      - 'MultiTagSearch/**'
      - '.github/workflows/multitagsearch.yml'
    tags:
      - 'multitagsearch-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: MultiTagSearch
        run: dotnet build -c Release -o out

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MultiTagSearch
          path: MultiTagSearch/out/MultiTagSearch.dll

      - name: Attach DLL to release
        if: startsWith(github.ref, 'refs/tags/multitagsearch-v')
        uses: softprops/action-gh-release@v2
        with:
          files: MultiTagSearch/out/MultiTagSearch.dll
